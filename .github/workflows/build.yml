- name: Repair invalid resource filenames
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("decoded/res")
          if not root.is_dir():
              raise SystemExit("ERROR: decoded/res does not exist.")

          # Map old resource names to new resource names.
          mapping = {}

          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue

              old_stem = path.stem
              new_stem = re.sub(r"[^a-z0-9_.]", "_", old_stem.lower())

              if old_stem == new_stem:
                  continue

              destination = path.with_name(new_stem + path.suffix.lower())

              if destination.exists():
                  raise SystemExit(
                      f"ERROR: Resource collision: {path} -> {destination}"
                  )

              if old_stem in mapping and mapping[old_stem] != new_stem:
                  raise SystemExit(
                      f"ERROR: Ambiguous resource name: {old_stem}"
                  )

              mapping[old_stem] = new_stem
              path.rename(destination)

              print(f"Renamed {path} -> {destination}")

          # Update references to resource names, not just filenames.
          extensions = {
              ".xml", ".smali", ".txt", ".json",
              ".html", ".js", ".properties", ".yaml", ".yml"
          }

          for path in Path("decoded").rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix.lower() not in extensions:
                  continue

              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              updated = original

              for old, new in sorted(
                  mapping.items(),
                  key=lambda item: len(item[0]),
                  reverse=True
              ):
                  updated = updated.replace(old, new)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  print(f"Updated resource references in {path}")

          print(f"Processed {len(mapping)} resource-name changes.")
          PY
