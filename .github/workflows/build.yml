name: Build Crawless Roleplay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zip unzip python3

      - name: Verify project files
        run: |
          set -e
          for file in \
            FreeCityRP_v23.apk.part00 \
            FreeCityRP_v23.apk.part01 \
            FreeCityRP_v23.apk.part02 \
            FreeCityRP_v23.apk.part03 \
            crawless_icon.png \
            customize.py
          do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

      - name: Reassemble original APK
        run: |
          set -e
          cat \
            FreeCityRP_v23.apk.part00 \
            FreeCityRP_v23.apk.part01 \
            FreeCityRP_v23.apk.part02 \
            FreeCityRP_v23.apk.part03 \
            > FreeCityRP_v23.apk

          unzip -t FreeCityRP_v23.apk

      - name: Decode APK
        run: |
          apktool d \
            -f \
            FreeCityRP_v23.apk \
            -o decoded

      - name: Inspect decoded APK
        run: |
          echo "Manifest:"
          grep -n "application" decoded/AndroidManifest.xml || true
          echo "Launcher resources:"
          find decoded/res -maxdepth 2 -type f \
            | grep -E 'mipmap|drawable' \
            | head -100

      - name: Build APK
        run: |
          apktool b decoded -o Crawless_Roleplay_unsigned.apk

      - name: Sign APK
        run: |
          set -e

          keytool -genkeypair \
            -keystore crawless-test.keystore \
            -storepass temporary123 \
            -keypass temporary123 \
            -alias crawless \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Crawless Roleplay"

          apksigner sign \
            --ks crawless-test.keystore \
            --ks-key-alias crawless \
            --ks-pass pass:temporary123 \
            --key-pass pass:temporary123 \
            --out Crawless_Roleplay_test.apk \
            Crawless_Roleplay_unsigned.apk

          apksigner verify --verbose Crawless_Roleplay_test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crawless-Roleplay-test-APK
          path: Crawless_Roleplay_test.apk
          if-no-files-found: error
          retention-days: 7
